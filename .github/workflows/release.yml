# Release completa: app de escritorio CON el núcleo CAD, CLI y WASM.
#
# El prefijo `pre.` del tag es solo parte del nombre: la release se publica
# como release normal y queda marcada como la más reciente.
#
# Se lanza a mano (Actions → Release → Run workflow, o
#   gh workflow run Release --ref <rama> -f plataformas=linux)
# y publica el commit de la rama elegida; el tag lo crea la propia release.
# También al subir un tag con el formato pre.<YYYY>.<MM>.<DD>.<sha7> (fecha del
# commit en UTC), que es lo que hace ./scripts/release.sh [commit].
#
# plataformas: linux (por defecto), linux-windows o todas (Windows y macOS además).
#
# OpenCASCADE se compila mínimo y estático con scripts/build-occt.sh (solo
# modelado y STEP, sin visualización ni X11) y queda en caché por versión,
# sistema y hash del script: la primera vez tarda ~30 min por plataforma,
# después sale de caché. CAD_REQUIRE_OCCT=1 hace que la app no salga sin CAD.
#
# Artefactos:
#   - App de escritorio     binario Linux + .AppImage, .msi/-setup.exe, .dmg (arm64)
#   - CLI `converter`       Linux x86_64, Windows x86_64, macOS arm64 + x86_64
#   - Paquete WASM          converter-wasm (wasm-bindgen --target web)

name: Release

on:
  push:
    tags:
      - "pre.*"
  workflow_dispatch:
    inputs:
      plataformas:
        description: "Plataformas a compilar"
        type: choice
        options: [linux, linux-windows, todas]
        default: linux

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  OCCT_VERSION: "7.9.3"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  version:
    name: Validar tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      cli: ${{ steps.matrix.outputs.cli }}
      desktop: ${{ steps.matrix.outputs.desktop }}
    steps:
      - uses: actions/checkout@v5

      - id: tag
        env:
          TAG: ${{ github.ref_name }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          date=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y.%m.%d HEAD)
          sha=$(git rev-parse --short=7 HEAD)
          expected="pre.${date}.${sha}"
          # A mano no hay tag todavía: lo crea la release
          if [[ "$MANUAL" == true ]]; then
            TAG="$expected"
          elif [[ "$TAG" != "$expected" ]]; then
            echo "::error::Tag '${TAG}' no coincide con el commit. Esperado: '${expected}' (usa scripts/release.sh)"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versión: ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - id: matrix
        env:
          # Con tag no hay inputs: compila todas
          PLATAFORMAS: ${{ github.event_name == 'workflow_dispatch' && inputs.plataformas || 'todas' }}
        run: |
          cli='[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}'
          desktop='[{"os":"ubuntu-22.04","platform":"linux"}'
          if [[ "$PLATAFORMAS" != linux ]]; then
            cli+=',{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}'
            desktop+=',{"os":"windows-latest","platform":"windows"}'
          fi
          if [[ "$PLATAFORMAS" == todas ]]; then
            cli+=',{"os":"macos-latest","target":"aarch64-apple-darwin"}'
            cli+=',{"os":"macos-latest","target":"x86_64-apple-darwin"}'
            desktop+=',{"os":"macos-latest","platform":"macos"}'
          fi
          echo "cli=${cli}]" >> "$GITHUB_OUTPUT"
          echo "desktop=${desktop}]" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # Todo el workspace con OCCT real (los tests del CAD no se saltan). Mismo
  # sistema que el desktop de Linux, así este job deja OCCT en caché para él.
  test:
    name: Tests (con CAD)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev ninja-build

      # restore/save por separado: si después falla el job, OCCT ya quedó guardado.
      - name: OCCT en caché
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: occt-static
          key: occt-${{ env.OCCT_VERSION }}-ubuntu-22.04-${{ hashFiles('scripts/build-occt.sh') }}

      - name: Compilar OCCT estático
        if: steps.occt-cache.outputs.cache-hit != 'true'
        env:
          CMAKE_GENERATOR: Ninja
        run: OCCT_WORK_DIR="$RUNNER_TEMP/occt" scripts/build-occt.sh "$PWD/occt-static" "$OCCT_VERSION"

      - name: Guardar OCCT en caché
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: occt-static
          key: ${{ steps.occt-cache.outputs.cache-primary-key }}

      - name: Rutas de OCCT
        run: |
          echo "OCCT_STATIC=1" >> "$GITHUB_ENV"
          echo "CAD_REQUIRE_OCCT=1" >> "$GITHUB_ENV"
          echo "OCCT_INCLUDE_DIR=$PWD/occt-static/include/opencascade" >> "$GITHUB_ENV"
          echo "OCCT_LIB_DIR=$PWD/occt-static/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-cad

      - run: cargo test --workspace --locked --no-fail-fast

  # ───────────────────────────────────────────────────────────────────────────
  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.desktop) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file ninja-build

      - name: Entorno de MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      # En bash el link.exe de Git (coreutils) tapa al linker de MSVC.
      - name: Quitar link.exe de Git (Windows)
        if: matrix.platform == 'windows'
        run: rm -f /usr/bin/link.exe

      - name: OCCT en caché
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: occt-static
          key: occt-${{ env.OCCT_VERSION }}-${{ matrix.os }}-${{ hashFiles('scripts/build-occt.sh') }}

      - name: Compilar OCCT estático
        if: steps.occt-cache.outputs.cache-hit != 'true'
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          if [[ "${{ matrix.platform }}" == macos ]]; then brew install ninja; fi
          OCCT_WORK_DIR="$RUNNER_TEMP/occt" scripts/build-occt.sh "$PWD/occt-static" "$OCCT_VERSION"

      - name: Guardar OCCT en caché
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: occt-static
          key: ${{ steps.occt-cache.outputs.cache-primary-key }}

      - name: Rutas de OCCT
        run: |
          # En Windows, ruta nativa (C:/...) y no la de MSYS (/c/...)
          root=$PWD
          if [[ "${{ matrix.platform }}" == windows ]]; then root=$(cygpath -m "$PWD"); fi
          echo "OCCT_STATIC=1" >> "$GITHUB_ENV"
          echo "CAD_REQUIRE_OCCT=1" >> "$GITHUB_ENV"
          echo "OCCT_INCLUDE_DIR=$root/occt-static/include/opencascade" >> "$GITHUB_ENV"
          echo "OCCT_LIB_DIR=$root/occt-static/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-cad-${{ matrix.platform }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar frontend
        working-directory: apps/web
        run: npm ci

      - name: Build Tauri
        working-directory: apps/desktop
        run: |
          # Linux: sin .deb ni .rpm; el binario suelto se publica aparte
          if [[ "${{ matrix.platform }}" == linux ]]; then
            node ../web/node_modules/@tauri-apps/cli/tauri.js build --bundles appimage
          else
            node ../web/node_modules/@tauri-apps/cli/tauri.js build
          fi

      - name: Renombrar instaladores
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in target/release/bundle/*/*; do
            case "$f" in
              *.AppImage)  out="linux-amd64.AppImage" ;;
              *.msi)       out="windows-x64.msi" ;;
              *-setup.exe) out="windows-x64-setup.exe" ;;
              *.dmg)       out="macos-arm64.dmg" ;;
              *)           continue ;;
            esac
            cp "$f" "dist/Pinocchio-${TAG}-${out}"
          done
          # Binario Linux suelto (requiere webkit2gtk-4.1 instalado en el sistema)
          if [[ "${{ matrix.platform }}" == linux ]]; then
            cp target/release/pinocchio-app "dist/Pinocchio-${TAG}-linux-x86_64"
            chmod +x "dist/Pinocchio-${TAG}-linux-x86_64"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  cli:
    name: CLI (${{ matrix.target }})
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.cli) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - run: cargo build --release --locked -p converter-cli --target ${{ matrix.target }}

      - name: Empaquetar
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          name="converter-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          bin_dir="target/${{ matrix.target }}/release"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "${bin_dir}/converter.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
          else
            cp "${bin_dir}/converter" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
          rm -rf "dist/${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  wasm:
    name: WASM
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Versión de wasm-bindgen (Cargo.lock)
        id: wb
        run: |
          ver=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}

      - name: Build
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cargo build --release --locked -p converter-wasm --target wasm32-unknown-unknown
          name="converter-wasm-${TAG}"
          wasm-bindgen --target web --out-dir "dist/${name}" \
            target/wasm32-unknown-unknown/release/converter_wasm.wasm
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/*
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Publicar release
    needs: [version, desktop, cli, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            # El tag lo crea GitHub con el token del workflow: no relanza este workflow
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --latest \
              --generate-notes
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "$TAG" \
              --latest \
              --generate-notes
          fi
