# Release completa: app de escritorio CON el núcleo CAD, CLI y WASM.
#
# El prefijo `pre.` del tag es solo parte del nombre: la release se publica
# como release normal y queda marcada como la más reciente.
#
# Se lanza a mano (Actions → Release → Run workflow, o
#   gh workflow run Release --ref <rama> -f plataformas=linux)
# y publica el commit de la rama elegida; el tag lo crea la propia release.
# También al subir un tag con el formato pre.<YYYY>.<MM>.<DD>.<sha7> (fecha del
# commit en UTC), que es lo que hace ./scripts/release.sh [commit].
#
# plataformas: linux (por defecto), windows, macos, android, sus combinaciones
# (linux-windows, linux-macos, windows-macos) o todas (las cuatro).
#
# Cada plataforma compila por su cuenta (desktop-build.yml, android.yml) y se
# publica apenas termina (release-publish.yml), en este orden: Linux, Windows,
# Android, macOS. Si una falla, las demás se compilan y se publican igual. Los
# tests del workspace corren en paralelo y no frenan la release.
#
# OpenCASCADE se compila mínimo y estático con scripts/build-occt.sh (solo
# modelado y STEP, sin visualización ni X11) y queda en caché por versión,
# sistema y hash del script: la primera vez tarda ~30 min por plataforma,
# después sale de caché. CAD_REQUIRE_OCCT=1 hace que la app no salga sin CAD.
#
# Artefactos:
#   - App de escritorio     binario Linux + .AppImage, .msi/-setup.exe, .dmg (arm64)
#   - Motor de laminado     dentro del ejecutable de la app (PINOCCHIO_SLICER_EMBED,
#                           comprimido; se extrae a la caché del usuario la primera
#                           vez): el binario Linux y el AppImage son un solo archivo.
#                           En Windows va con sus DLL. Lo compila slicer-engine.yml
#                           (con caché) en las mismas plataformas que la app
#   - latest.json           para que la app se actualice sola (tauri-plugin-updater):
#                           AppImage, -setup.exe/.msi y .app.tar.gz firmados con
#                           los secretos TAURI_SIGNING_PRIVATE_KEY y _PASSWORD (pública en
#                           apps/desktop/tauri.conf.json). Las firmas van dentro de
#                           latest.json: los .sig no se publican
#   - CLI `converter` y paquete WASM: solo si se piden a mano (input `cli`), y quedan
#     como artefactos del workflow, no en la release
#
# La release lleva solo: binario Linux, AppImage, -setup.exe, .msi (y .dmg si se
# compila macOS) más latest.json, que la app necesita para actualizarse.
#
# Versión de la app: la fecha y hora del commit en UTC como semver
# AA.M.<minuto del mes> (p. ej. 26.10.35849 = 25 de octubre de 2026, 21:29):
# crece con cada release y es la que la app compara para saber si hay una
# nueva. El instalador MSI no acepta más de 255.255.65535.

name: Release

on:
  push:
    tags:
      - "pre.*"
  workflow_dispatch:
    inputs:
      plataformas:
        description: "Plataformas a compilar"
        type: choice
        options: [linux, windows, macos, android, linux-windows, linux-macos, windows-macos, todas]
        default: linux
      cli:
        description: "También la CLI y el paquete WASM (quedan como artefactos del workflow, no en la release)"
        type: boolean
        default: false
      tests:
        description: "Correr los tests del workspace antes (~30 min)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  OCCT_VERSION: "8.0.1"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  version:
    name: Validar tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      semver: ${{ steps.tag.outputs.semver }}
      cli: ${{ steps.matrix.outputs.cli }}
      linux: ${{ steps.matrix.outputs.linux }}
      windows: ${{ steps.matrix.outputs.windows }}
      macos: ${{ steps.matrix.outputs.macos }}
      android: ${{ steps.matrix.outputs.android }}
    steps:
      - uses: actions/checkout@v5

      - id: tag
        env:
          TAG: ${{ github.ref_name }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          date=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y.%m.%d HEAD)
          sha=$(git rev-parse --short=7 HEAD)
          expected="pre.${date}.${sha}"
          # A mano no hay tag todavía: lo crea la release
          if [[ "$MANUAL" == true ]]; then
            TAG="$expected"
          elif [[ "$TAG" != "$expected" ]]; then
            echo "::error::Tag '${TAG}' no coincide con el commit. Esperado: '${expected}' (usa scripts/release.sh)"
            exit 1
          fi
          # 10#: que 08 o 09 no se lean en octal
          read -r y m d hh mm <<< "$(TZ=UTC0 git show -s --format=%cd --date=format-local:'%y %m %d %H %M' HEAD)"
          semver="$((10#$y)).$((10#$m)).$(((10#$d - 1) * 1440 + 10#$hh * 60 + 10#$mm))"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"
          echo "Versión: ${TAG} (${semver})" >> "$GITHUB_STEP_SUMMARY"

      - id: matrix
        env:
          # Con tag no hay inputs: compila todas
          PLATAFORMAS: ${{ github.event_name == 'workflow_dispatch' && inputs.plataformas || 'todas' }}
        run: |
          # "todas" o una lista con guiones (linux-macos, windows, ...)
          [[ "$PLATAFORMAS" == todas ]] && PLATAFORMAS=linux-windows-macos-android
          cli=()
          for p in linux windows macos android; do
            if [[ "$PLATAFORMAS" == *$p* ]]; then echo "$p=true" >> "$GITHUB_OUTPUT"; else echo "$p=false" >> "$GITHUB_OUTPUT"; fi
          done
          [[ "$PLATAFORMAS" == *linux* ]] && cli+=('{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}')
          [[ "$PLATAFORMAS" == *windows* ]] && cli+=('{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}')
          if [[ "$PLATAFORMAS" == *macos* ]]; then
            cli+=('{"os":"macos-latest","target":"aarch64-apple-darwin"}')
            cli+=('{"os":"macos-latest","target":"x86_64-apple-darwin"}')
          fi
          join() { local IFS=,; echo "[$*]"; }
          echo "cli=$(join "${cli[@]}")" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # Todo el workspace con OCCT real (los tests del CAD no se saltan). Corre en
  # paralelo: informa, pero no frena la compilación ni la publicación.
  test:
    name: Tests (con CAD)
    # A mano se pueden saltar (input `tests`); con tag van siempre
    if: github.event_name != 'workflow_dispatch' || inputs.tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev ninja-build

      # restore/save por separado: si después falla el job, OCCT ya quedó guardado.
      - name: OCCT en caché
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: occt-static
          key: occt-${{ env.OCCT_VERSION }}-ubuntu-22.04-${{ hashFiles('scripts/build-occt.sh') }}

      - name: Compilar OCCT estático
        if: steps.occt-cache.outputs.cache-hit != 'true'
        env:
          CMAKE_GENERATOR: Ninja
        run: OCCT_WORK_DIR="$RUNNER_TEMP/occt" scripts/build-occt.sh "$PWD/occt-static" "$OCCT_VERSION"

      - name: Guardar OCCT en caché
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: occt-static
          key: ${{ steps.occt-cache.outputs.cache-primary-key }}

      - name: Rutas de OCCT
        run: |
          echo "OCCT_STATIC=1" >> "$GITHUB_ENV"
          echo "CAD_REQUIRE_OCCT=1" >> "$GITHUB_ENV"
          echo "OCCT_INCLUDE_DIR=$PWD/occt-static/include/opencascade" >> "$GITHUB_ENV"
          echo "OCCT_LIB_DIR=$PWD/occt-static/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-cad

      - run: cargo test --workspace --locked --no-fail-fast

  # ───────────────────────────────────────────────────────────────────────────
  # Motor de laminado: en paralelo con los tests; casi siempre sale de caché
  # Motor de laminado y app de escritorio, cada plataforma por su lado: la que
  # termina se publica sin esperar a las otras, y si una falla las demás siguen
  slicer-linux:
    name: Motor de laminado (linux)
    needs: [version]
    if: needs.version.outputs.linux == 'true'
    uses: ./.github/workflows/slicer-engine.yml
    with:
      plataformas: linux

  slicer-windows:
    name: Motor de laminado (windows)
    needs: [version]
    if: needs.version.outputs.windows == 'true'
    uses: ./.github/workflows/slicer-engine.yml
    with:
      plataformas: windows

  slicer-macos:
    name: Motor de laminado (macos)
    needs: [version]
    if: needs.version.outputs.macos == 'true'
    uses: ./.github/workflows/slicer-engine.yml
    with:
      plataformas: macos

  desktop-linux:
    name: Linux
    needs: [version, slicer-linux]
    if: ${{ !cancelled() && needs.slicer-linux.result == 'success' }}
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      platform: linux
      os: ubuntu-22.04
      tag: ${{ needs.version.outputs.tag }}
      semver: ${{ needs.version.outputs.semver }}

  desktop-windows:
    name: Windows
    needs: [version, slicer-windows]
    if: ${{ !cancelled() && needs.slicer-windows.result == 'success' }}
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      platform: windows
      os: windows-latest
      tag: ${{ needs.version.outputs.tag }}
      semver: ${{ needs.version.outputs.semver }}

  desktop-macos:
    name: macOS
    needs: [version, slicer-macos]
    if: ${{ !cancelled() && needs.slicer-macos.result == 'success' }}
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      platform: macos
      os: macos-latest
      tag: ${{ needs.version.outputs.tag }}
      semver: ${{ needs.version.outputs.semver }}

  android:
    name: Android
    needs: [version]
    if: needs.version.outputs.android == 'true'
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      # El APK va a esta release (lo sube publish-android), no a una propia
      publicar: false

  # ───────────────────────────────────────────────────────────────────────────
  cli:
    name: CLI (${{ matrix.target }})
    needs: [version]
    # Solo a mano y si se piden (input `cli`); no van a la release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cli }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.cli) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - run: cargo build --release --locked -p converter-cli --target ${{ matrix.target }}

      - name: Empaquetar
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          name="converter-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          bin_dir="target/${{ matrix.target }}/release"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "${bin_dir}/converter.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
          else
            cp "${bin_dir}/converter" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
          rm -rf "dist/${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  wasm:
    name: WASM
    needs: [version]
    # Solo a mano y si se piden (input `cli`); no van a la release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cli }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Versión de wasm-bindgen (Cargo.lock)
        id: wb
        run: |
          ver=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}

      - name: Build
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cargo build --release --locked -p converter-wasm --target wasm32-unknown-unknown
          name="converter-wasm-${TAG}"
          wasm-bindgen --target web --out-dir "dist/${name}" \
            target/wasm32-unknown-unknown/release/converter_wasm.wasm
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/*
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Publicación en cadena: Linux → Windows → Android → macOS. Cada una espera a
  # la anterior (así salen en ese orden y no se pisan latest.json) pero publica
  # aunque la anterior haya fallado o no se haya compilado.
  publish-linux:
    name: Publicar Linux
    needs: [version, desktop-linux]
    if: ${{ !cancelled() && needs.desktop-linux.result == 'success' }}
    uses: ./.github/workflows/release-publish.yml
    with:
      artifact: desktop-linux
      tag: ${{ needs.version.outputs.tag }}
      semver: ${{ needs.version.outputs.semver }}

  publish-windows:
    name: Publicar Windows
    needs: [version, desktop-windows, publish-linux]
    if: ${{ !cancelled() && needs.desktop-windows.result == 'success' }}
    uses: ./.github/workflows/release-publish.yml
    with:
      artifact: desktop-windows
      tag: ${{ needs.version.outputs.tag }}
      semver: ${{ needs.version.outputs.semver }}

  publish-android:
    name: Publicar Android
    needs: [version, android, publish-windows]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    uses: ./.github/workflows/release-publish.yml
    with:
      artifact: android-arm64
      tag: ${{ needs.version.outputs.tag }}
      semver: ${{ needs.version.outputs.semver }}
      # La app de Android no se actualiza sola: no va en latest.json
      updater: false

  publish-macos:
    name: Publicar macOS
    needs: [version, desktop-macos, publish-android]
    if: ${{ !cancelled() && needs.desktop-macos.result == 'success' }}
    uses: ./.github/workflows/release-publish.yml
    with:
      artifact: desktop-macos
      tag: ${{ needs.version.outputs.tag }}
      semver: ${{ needs.version.outputs.semver }}
