# Compila la app de escritorio (con el CAD y el motor de laminado dentro) para
# UNA plataforma y deja los instaladores firmados como artefacto
# desktop-<plataforma>. Lo llama release.yml una vez por plataforma, para que
# cada una termine y se publique sin esperar a las otras.

name: Desktop

on:
  workflow_call:
    inputs:
      platform:
        description: "linux, windows o macos"
        type: string
        required: true
      os:
        description: "Runner"
        type: string
        required: true
      tag:
        description: "Tag de la release (para los nombres de los archivos)"
        type: string
        required: true
      semver:
        description: "Versión de la app (AA.M.minuto-del-mes)"
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always
  OCCT_VERSION: "8.0.1"

jobs:
  build:
    name: Desktop (${{ inputs.platform }})
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema (Linux)
        if: inputs.platform == 'linux'
        # El espejo de Ubuntu a veces se cuelga (una hora a 18 kB/s): límite de tiempo y reintentos
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do
            if sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update \
              && sudo timeout 480 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y \
                libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
                librsvg2-dev patchelf file ninja-build; then
              exit 0
            fi
            echo "apt falló (intento $i de 3)"; sleep 10
          done
          exit 1

      - name: Entorno de MSVC (Windows)
        if: inputs.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      # En bash el link.exe de Git (coreutils) tapa al linker de MSVC.
      - name: Quitar link.exe de Git (Windows)
        if: inputs.platform == 'windows'
        run: rm -f /usr/bin/link.exe

      - name: OCCT en caché
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: occt-static
          key: occt-${{ env.OCCT_VERSION }}-${{ inputs.os }}-${{ hashFiles('scripts/build-occt.sh') }}

      - name: Compilar OCCT estático
        if: steps.occt-cache.outputs.cache-hit != 'true'
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          if [[ "${{ inputs.platform }}" == macos ]]; then brew install ninja; fi
          OCCT_WORK_DIR="$RUNNER_TEMP/occt" scripts/build-occt.sh "$PWD/occt-static" "$OCCT_VERSION"

      - name: Guardar OCCT en caché
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: occt-static
          key: ${{ steps.occt-cache.outputs.cache-primary-key }}

      - name: Rutas de OCCT
        run: |
          # En Windows, ruta nativa (C:/...) y no la de MSYS (/c/...)
          root=$PWD
          if [[ "${{ inputs.platform }}" == windows ]]; then root=$(cygpath -m "$PWD"); fi
          echo "OCCT_STATIC=1" >> "$GITHUB_ENV"
          echo "CAD_REQUIRE_OCCT=1" >> "$GITHUB_ENV"
          echo "OCCT_INCLUDE_DIR=$root/occt-static/include/opencascade" >> "$GITHUB_ENV"
          echo "OCCT_LIB_DIR=$root/occt-static/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-cad-${{ inputs.platform }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar frontend
        working-directory: apps/web
        run: npm ci

      # Va dentro del ejecutable (ver PINOCCHIO_SLICER_EMBED en «Build Tauri»)
      - name: Motor de laminado
        uses: actions/download-artifact@v4
        with:
          name: slicer-engine-${{ inputs.platform }}
          path: libs/slicer/bin

      - name: Build Tauri
        working-directory: apps/desktop
        env:
          # Firma de las actualizaciones (.sig junto a cada instalador)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Con contraseña: la clave sin contraseña de `signer generate` no firma
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SEMVER: ${{ inputs.semver }}
        run: |
          # La versión y los artefactos de actualización solo acá: un build
          # local no necesita la clave
          config="{\"version\":\"${SEMVER}\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
          # El motor de laminado (la carpeta: en Windows lleva sus DLL) se embebe
          # solo acá; un build local lo busca en libs/slicer/bin
          bin="$GITHUB_WORKSPACE/libs/slicer/bin"
          if [[ "${{ inputs.platform }}" == windows ]]; then bin=$(cygpath -m "$bin"); fi
          export PINOCCHIO_SLICER_EMBED="$bin"
          # Linux: sin .deb ni .rpm; el binario suelto se publica aparte.
          if [[ "${{ inputs.platform }}" == linux ]]; then
            node ../web/node_modules/@tauri-apps/cli/tauri.js build --bundles appimage --config "$config"
          else
            node ../web/node_modules/@tauri-apps/cli/tauri.js build --config "$config"
          fi

      - name: Renombrar instaladores
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in target/release/bundle/*/*; do
            case "$f" in
              *.AppImage)      out="linux-amd64.AppImage" ;;
              *.AppImage.sig)  out="linux-amd64.AppImage.sig" ;;
              *.msi)           out="windows-x64.msi" ;;
              *.msi.sig)       out="windows-x64.msi.sig" ;;
              *-setup.exe)     out="windows-x64-setup.exe" ;;
              *-setup.exe.sig) out="windows-x64-setup.exe.sig" ;;
              *.dmg)           out="macos-arm64.dmg" ;;
              *.app.tar.gz)    out="macos-arm64.app.tar.gz" ;;
              *.app.tar.gz.sig) out="macos-arm64.app.tar.gz.sig" ;;
              *)               continue ;;
            esac
            cp "$f" "dist/Pinocchio-${TAG}-${out}"
          done
          # Sin firma la app no se actualiza sola: que falle acá y no en los usuarios
          if ! ls dist/*.sig > /dev/null 2>&1; then
            echo "::error::No se firmaron los instaladores (¿falta el secreto TAURI_SIGNING_PRIVATE_KEY?)"
            exit 1
          fi
          # Binario Linux suelto (requiere webkit2gtk-4.1 instalado en el sistema)
          if [[ "${{ inputs.platform }}" == linux ]]; then
            cp target/release/pinocchio-app "dist/Pinocchio-${TAG}-linux-x86_64"
            chmod +x "dist/Pinocchio-${TAG}-linux-x86_64"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ inputs.platform }}
          path: dist/*
          if-no-files-found: error
