[workspace]
resolver = "2"
members = [
    # Pinocchio - Rigging automático
    "libs/pinocchio/math",
    "libs/pinocchio/sparse",
    "libs/pinocchio/mesh",
    "libs/pinocchio/skeleton",
    "libs/pinocchio/spatial",
    "libs/pinocchio/graph",
    "libs/pinocchio/attachment",
    "libs/pinocchio/embedding",
    "libs/pinocchio/repair",
    "libs/pinocchio/print3d",
    "libs/pinocchio/core",
    # QuadriFlow - Quad remeshing
    "libs/quadriflow/core",
    # UV - Coordenadas de textura
    "libs/uv/core",
    # Orizon3D - Escáneres 3D
    "libs/orizon3d",
    # CAD paramétrico
    "libs/cad/solver",
    "libs/cad/occt",
    "libs/cad/model",
    "libs/cad/scan",
    # Converter - Conversión de formatos 3D
    "libs/converter/scene",
    "libs/converter/gltf-io",
    "libs/converter/usda",
    "libs/converter/stl",
    "libs/converter/obj",
    "libs/converter/ply",
    "libs/converter/threemf",
    "libs/converter/layers",
    "libs/converter/core",
    "libs/converter/wasm",
    # Apps
    "apps/desktop",
    "apps/converter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Debaq/Pinocchiors"
rust-version = "1.88"

[workspace.dependencies]
# Matemáticas
nalgebra = "0.33"

# Matrices sparse
sprs = "0.11"

# Grafos
petgraph = "0.7"

# I/O mallas
tobj = "4.0"
gltf = { version = "1.4", features = ["KHR_materials_unlit", "KHR_texture_transform", "KHR_materials_pbrSpecularGlossiness", "extensions"] }
stl_io = "0.10"

# 3D math (ligero, para converter)
glam = "0.29"

# Procesamiento de texturas
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tga", "bmp"] }

# Compresión Draco (Rust puro) y reducción de triángulos
draco-core = { version = "2.2", default-features = false, features = ["encoder", "decoder", "edgebreaker_valence_encode", "edgebreaker_valence_decode"] }
meshopt = "0.6"

# Compresión zlib (capas de XCF y PSD)
flate2 = "1"

# Empaquetado USDZ
zip = { version = "4", default-features = false }

# Paralelismo
rayon = "1.10"

# Triangulación restringida y predicados exactos (reparación de intersecciones)
spade = "2.15"
robust = "1.2"
bevy_mikktspace = "1"

# Serialización
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
rmp-serde = "1"

# Errores
thiserror = "2.0"

# WASM
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

# Testing
proptest = "1.6"
criterion = "0.5"
approx = "0.5"

# Crates internos - Pinocchio
pinocchio-math = { path = "libs/pinocchio/math" }
pinocchio-sparse = { path = "libs/pinocchio/sparse" }
pinocchio-mesh = { path = "libs/pinocchio/mesh" }
pinocchio-skeleton = { path = "libs/pinocchio/skeleton" }
pinocchio-spatial = { path = "libs/pinocchio/spatial" }
pinocchio-graph = { path = "libs/pinocchio/graph" }
pinocchio-attachment = { path = "libs/pinocchio/attachment" }
pinocchio-embedding = { path = "libs/pinocchio/embedding" }
pinocchio-repair = { path = "libs/pinocchio/repair" }
pinocchio-print3d = { path = "libs/pinocchio/print3d" }
pinocchio-core = { path = "libs/pinocchio/core" }

# Crates internos - QuadriFlow
quadriflow-core = { path = "libs/quadriflow/core" }

# Crates internos - UV
uv-core = { path = "libs/uv/core" }
orizon3d-core = { path = "libs/orizon3d" }

# Crates internos - CAD
cad-solver = { path = "libs/cad/solver" }
cad-occt = { path = "libs/cad/occt" }
cad-model = { path = "libs/cad/model" }
cad-scan = { path = "libs/cad/scan" }

# Crates internos - Converter
converter-scene = { path = "libs/converter/scene" }
converter-gltf-io = { path = "libs/converter/gltf-io", default-features = false }
converter-usda = { path = "libs/converter/usda" }
converter-stl = { path = "libs/converter/stl" }
converter-obj = { path = "libs/converter/obj" }
converter-ply = { path = "libs/converter/ply" }
converter-3mf = { path = "libs/converter/threemf" }
converter-layers = { path = "libs/converter/layers" }
converter-core = { path = "libs/converter/core" }

# CLI
clap = { version = "4", features = ["derive"] }

[profile.dev]
debug = 1            # debug info limitada (suficiente para backtraces, ~50% menos espacio)
split-debuginfo = "packed"  # compactar debug info en un solo archivo

# Numérico pesado: sin optimizar, sus tests tardan minutos
[profile.dev.package.quadriflow-core]
opt-level = 2

[profile.dev.package.uv-core]
opt-level = 2

[profile.dev.package.nalgebra]
opt-level = 2

# Reparación de mallas: sin optimizar es muy lenta con modelos reales
[profile.dev.package.pinocchio-repair]
opt-level = 2

[profile.dev.package.pinocchio-mesh]
opt-level = 2

[profile.dev.package.pinocchio-embedding]
opt-level = 2

[profile.dev.package.pinocchio-spatial]
opt-level = 2

[profile.dev.package.pinocchio-attachment]
opt-level = 2

[profile.dev.package.pinocchio-sparse]
opt-level = 2

# Escáner 3D: sin optimizar procesa ~2 cuadros por segundo al escanear y el
# seguimiento se pierde entre cuadros; el color MJPG se decodifica en cada uno
[profile.dev.package.orizon3d-core]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Escaneo → CAD: segmentación y rayos sobre mallas grandes
[profile.dev.package.cad-scan]
opt-level = 2

[profile.dev.package.cad-solver]
opt-level = 2
