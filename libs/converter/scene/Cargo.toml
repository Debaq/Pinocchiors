[package]
name = "converter-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Intermediate 3D scene representation for format conversion"

[features]
# Serialización (archivos de proyecto de la app)
serde = ["dep:serde", "dep:serde_bytes", "glam/serde"]

[dependencies]
glam = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
