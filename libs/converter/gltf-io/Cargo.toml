[package]
name = "converter-gltf-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "glTF/GLB import and export for converter-scene"

[dependencies]
converter-scene = { workspace = true }
gltf = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
draco-core = { workspace = true }
meshopt = { workspace = true, optional = true }

[features]
default = ["simplify"]
# Reducción de triángulos con meshoptimizer (C++ compilado con cc). El
# workspace lo desactiva para que converter-wasm no compile C++; core y la
# app lo piden explícitamente.
simplify = ["dep:meshopt"]

[dev-dependencies]
tempfile = "3"
