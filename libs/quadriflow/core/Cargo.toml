[package]
name = "quadriflow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Quad remeshing (Instant Meshes / QuadriFlow field-aligned)"

[dependencies]
pinocchio-math = { workspace = true }
pinocchio-mesh = { workspace = true }
pinocchio-spatial = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
# Simplificar (Remallar): meshoptimizer es C++ compilado con cc; detrás de una
# feature para que wasm no lo compile
meshopt = { workspace = true, optional = true }

[features]
simplify = ["dep:meshopt"]

[dev-dependencies]
pinocchio-mesh = { workspace = true, features = ["converter"] }
