[package]
name = "pinocchio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Main API for Pinocchio auto-rigging library"

[features]
default = []
wasm = ["wasm-bindgen", "getrandom/js", "pinocchio-math/wasm"]

[dependencies]
pinocchio-math = { workspace = true }
pinocchio-mesh = { workspace = true }
pinocchio-skeleton = { workspace = true }
pinocchio-sparse = { workspace = true }
pinocchio-spatial = { workspace = true }
pinocchio-graph = { workspace = true }
pinocchio-attachment = { workspace = true }
pinocchio-embedding = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
