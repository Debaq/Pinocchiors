[package]
name = "pinocchio-math"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mathematical primitives for Pinocchio: vectors, matrices, transforms"

[features]
default = []
wasm = ["getrandom/js"]

[dependencies]
nalgebra = { workspace = true }
approx = { workspace = true }
