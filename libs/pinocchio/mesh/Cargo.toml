[package]
name = "pinocchio-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Half-edge mesh data structure and I/O for Pinocchio"

[features]
default = []
## Integración con converter-scene para carga de formatos 3D via Scene intermedia
converter = ["dep:converter-scene", "dep:converter-gltf-io", "dep:converter-stl"]

[dependencies]
pinocchio-math = { workspace = true }
tobj = { workspace = true }
gltf = { workspace = true }
thiserror = { workspace = true }

# Dependencias opcionales para feature "converter"
converter-scene = { workspace = true, optional = true }
converter-gltf-io = { workspace = true, optional = true }
converter-stl = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
tempfile = "3"
