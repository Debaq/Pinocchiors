[package]
name = "pinocchio-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pinocchio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinocchio - Auto rigging
pinocchio-core = { workspace = true }
pinocchio-mesh = { workspace = true, features = ["converter"] }
pinocchio-skeleton = { workspace = true, features = ["converter"] }
pinocchio-math = { workspace = true }
pinocchio-attachment = { workspace = true }
pinocchio-embedding = { workspace = true }

# Converter - Multi-format I/O
converter-scene = { workspace = true, features = ["serde"] }
converter-gltf-io = { workspace = true, features = ["simplify"] }
converter-stl = { workspace = true }
converter-obj = { workspace = true }
converter-ply = { workspace = true }
converter-3mf = { workspace = true }

# Repair & Print3D
pinocchio-repair = { workspace = true }
pinocchio-print3d = { workspace = true }

# QuadriFlow - Retopology
quadriflow-core = { workspace = true }

# UV y texturas con capas (GIMP, Krita, Photoshop)
uv-core = { workspace = true }
converter-layers = { workspace = true }
image = { workspace = true }

# Escáneres 3D (Orizon3D)
orizon3d-core = { workspace = true }

# CAD paramétrico (OpenCASCADE) y escaneo → CAD
cad-model = { workspace = true }
cad-scan = { workspace = true }

# USDA/USDZ export
converter-usda = { workspace = true }

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = { workspace = true }
zip = { workspace = true, features = ["deflate"] }

# Async
tokio = { version = "1", features = ["sync"] }

# Errors
thiserror = { workspace = true }
rayon = { workspace = true }

# Cámara en el webview de Linux (captura de movimiento en vivo)
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_4"] }

[dev-dependencies]
nalgebra = { workspace = true }
tempfile = "3"
