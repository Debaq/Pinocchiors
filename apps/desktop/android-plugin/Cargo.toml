[package]
name = "tauri-plugin-pinocchio-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Pinocchio en Android: compartir archivos con el menú del sistema"
# Requisito de los plugins de Tauri: `links` igual al nombre (así el CLI encuentra
# el proyecto de Android y lo suma al APK)
links = "tauri-plugin-pinocchio-android"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
