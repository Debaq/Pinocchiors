[package]
name = "pinocchio-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Conector MCP suelto (la app instalada lo es con `--mcp`): cualquier IA usa Pinocchio"

[lib]
name = "pinocchio_mcp"
path = "src/lib.rs"

[[bin]]
name = "pinocchio-mcp"
path = "src/main.rs"

[dependencies]
pinocchio-app = { path = "../desktop" }

[dev-dependencies]
cad-model = { workspace = true }
serde_json = "1"
tempfile = "3"
